name: TVNext
options:
  bundleIdPrefix: dev.kahen
settings:
  base:
    SWIFT_VERSION: 5.9
    IPHONEOS_DEPLOYMENT_TARGET: 17.0
targets:
  TVNext:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: TVNext
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.kahen.tvnext
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
    info:
      path: TVNext/Info.plist
      properties:
        CFBundleDisplayName: TV-Next
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocalNetworkUsageDescription: 用于连接你配置的局域网媒体服务器、网盘及遥控设备。
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
  TVNextTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: tests/unit
        excludes: [Fixtures]
      - path: tests/unit/Fixtures
        buildPhase: resources
    dependencies:
      - target: TVNext
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  TVNextUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: tests/ui
    dependencies:
      - target: TVNext
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  TVNext:
    build:
      targets:
        TVNext: all
    test:
      gatherCoverageData: true
      targets:
        - name: TVNextTests
        - name: TVNextUITests
