name: Docker Compose Integration Smoke

on:
  push:
    branches:
      - main
      - feat/**
      - test/**
    paths:
      - compose.yaml
      - apps/web/**
      - services/api/**
      - fixtures/**
      - scripts/compose_smoke.py
      - .github/workflows/compose-smoke.yml
  pull_request:
    paths:
      - compose.yaml
      - apps/web/**
      - services/api/**
      - fixtures/**
      - scripts/compose_smoke.py
      - .github/workflows/compose-smoke.yml
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build and launch services
        run: docker compose up --build -d
      - name: Probe public Web, internal REST proxy and XMLTV endpoint
        run: python3 scripts/compose_smoke.py
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Install browser test dependencies
        working-directory: apps/web
        run: npm ci --no-audit --no-fund
      - name: Install real browser engines and media fixture tool
        working-directory: apps/web
        run: |
          npx playwright install --with-deps chromium firefox webkit
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Exercise decoded MP4/HLS and persistent library in three browsers
        working-directory: apps/web
        run: npm run test:e2e
      - name: Preserve browser failure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-acceptance-evidence
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 14
      - name: Container logs after failure
        if: failure()
        run: docker compose logs --no-color --tail=120
      - name: Tear down Compose stack
        if: always()
        run: docker compose down -v --remove-orphans
