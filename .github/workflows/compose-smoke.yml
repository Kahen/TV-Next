name: Docker Compose Integration Smoke

on:
  push:
    branches:
      - main
      - feat/**
      - test/**
    paths:
      - compose.yaml
      - apps/web/**
      - services/api/**
      - .github/workflows/compose-smoke.yml
  pull_request:
    paths:
      - compose.yaml
      - apps/web/**
      - services/api/**
      - .github/workflows/compose-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build and launch services
        run: docker compose up --build -d
      - name: Probe public Web, internal REST proxy and XMLTV endpoint
        run: python3 scripts/compose_smoke.py
      - name: Container logs after failure
        if: failure()
        run: docker compose logs --no-color --tail=120
      - name: Tear down Compose stack
        if: always()
        run: docker compose down -v --remove-orphans
