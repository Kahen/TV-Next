name: iOS (manual)
on:
  push:
    branches:
      - feat/**
    paths:
      - apps/ios/**
      - .github/workflows/ios.yml
  pull_request:
    paths:
      - apps/ios/**
      - .github/workflows/ios.yml
  workflow_dispatch:
jobs:
  simulator-build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: apps/ios
        run: xcodegen generate
      - name: Build for iOS Simulator (unsigned)
        working-directory: apps/ios
        run: xcodebuild -project TVNext.xcodeproj -scheme TVNext -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
