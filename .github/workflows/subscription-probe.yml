name: Explicit real subscription probe
on:
  push:
    branches: [feat/spider-subscription]
    paths:
      - "services/api/**"
      - "scripts/real_subscription_probe.py"
      - ".github/workflows/subscription-probe.yml"
permissions:
  contents: read
jobs:
  authorized-subscription:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Build and test API
        working-directory: services/api
        run: gradle test bootJar --no-daemon
      - name: Probe explicitly supplied subscription without executing plugins
        env:
          TV_NEXT_DB_URL: jdbc:h2:mem:subscription-probe
        run: |
          java -jar services/api/build/libs/*-SNAPSHOT.jar > "$RUNNER_TEMP/api.log" 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          python3 - <<'PY'
          import time, urllib.request
          for attempt in range(60):
              try:
                  urllib.request.urlopen('http://127.0.0.1:8080/api/v1/health',timeout=2).close()
                  break
              except OSError:
                  time.sleep(1)
          else:
              raise RuntimeError('API startup failed')
          PY
          python3 scripts/real_subscription_probe.py --subscription-url 'http://www.饭太硬.net/tv'
