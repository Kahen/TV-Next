name: JVM Dependency Integrity

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/jvm-dependency-integrity.yml'
      - 'services/api/**'
      - 'scripts/*gradle*'
  pull_request:
    paths:
      - '.github/workflows/jvm-dependency-integrity.yml'
      - 'services/api/**'
      - 'scripts/verify_gradle_dependencies.py'
      - 'scripts/test_verify_gradle_dependencies.py'
      - 'scripts/probe_gradle_integrity.py'
      - 'docs/JVM_DEPENDENCY_INTEGRITY.md'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: '8.14.3'
      - name: Reject widened or incomplete dependency evidence
        run: |
          python3 scripts/verify_gradle_dependencies.py
          python3 -m unittest discover -s scripts -p test_verify_gradle_dependencies.py
      - name: Build using committed versions and checksums
        run: gradle -p services/api bootJar --dependency-verification strict --no-daemon
      - name: Prove actual Gradle checksum and missing-lock rejection
        run: python3 scripts/probe_gradle_integrity.py
      - name: Ensure CI did not rewrite reviewed dependency evidence
        run: git diff --exit-code -- services/api/gradle.lockfile services/api/gradle/verification-metadata.xml
