name: JVM Dependency Integrity

on:
  pull_request:
    paths:
      - '.github/workflows/jvm-dependency-integrity.yml'
      - 'services/api/**'
      - 'scripts/verify_gradle_dependencies.py'
      - 'scripts/test_verify_gradle_dependencies.py'
      - 'docs/JVM_DEPENDENCY_INTEGRITY.md'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: '8.14.3'
      - name: Bootstrap dependency evidence for review (draft only)
        working-directory: services/api
        run: |
          set -euo pipefail
          gradle dependencies test bootJar --write-locks --write-verification-metadata sha256 --no-daemon
          python3 - <<'PYTHON'
          from pathlib import Path
          import base64
          for name in ('gradle.lockfile', 'gradle/verification-metadata.xml'):
              print('TVNEXT_DEPENDENCY_EVIDENCE ' + name + ' ' + base64.b64encode(Path(name).read_bytes()).decode())
          PYTHON
