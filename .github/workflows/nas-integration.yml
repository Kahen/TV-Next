name: NAS PostgreSQL Deployment Integration
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  nas:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TV_NEXT_DB_PASSWORD: nas_fixture_only_password
      TV_NEXT_REGISTRATION_OPEN: "true"
      TV_NEXT_CORS_ALLOWED_ORIGINS: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
      - name: Test WebSocket receiver readiness polling (synthetic)
        run: python -m unittest discover -s scripts -p 'test_home_server_smoke.py'
      - name: Validate and launch isolated NAS stack
        run: |
          docker compose -f compose.nas.yaml config --quiet
          docker compose -f compose.nas.yaml up --build --detach
      - name: Verify real HTTP, WebSocket upgrades, ownership and restart persistence
        run: |
          api_container=$(docker compose -f compose.nas.yaml ps -q api)
          api_address=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "$api_container")
          TV_NEXT_TEST_INTERNAL_API_URL="http://$api_address:8080" python scripts/home_server_smoke.py --restart-api
      - name: Verify a backup can be restored to a separate fixture database
        run: |
          docker compose -f compose.nas.yaml exec -T db pg_dump -U tvnext -d tvnext -Fc > /tmp/tvnext-fixture.dump
          docker compose -f compose.nas.yaml exec -T db createdb -U tvnext tvnext_restore
          docker compose -f compose.nas.yaml exec -T db pg_restore -U tvnext -d tvnext_restore --no-owner < /tmp/tvnext-fixture.dump
          users=$(docker compose -f compose.nas.yaml exec -T db psql -U tvnext -d tvnext_restore -Atc 'SELECT COUNT(*) FROM app_users;')
          test "$users" -ge 2
      - name: Logs after failure
        if: failure()
        run: docker compose -f compose.nas.yaml logs --no-color --tail=100
      - name: Remove isolated CI stack and fixture data
        if: always()
        run: docker compose -f compose.nas.yaml down --volumes --remove-orphans
