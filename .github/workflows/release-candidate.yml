name: Unsigned Web and Server Release Candidate

on:
  pull_request:
    paths:
      - '.github/workflows/release-candidate.yml'
      - 'scripts/package_candidate.py'
      - 'scripts/test_package_candidate.py'
  workflow_dispatch:
    inputs:
      version:
        description: 'vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-rc.N'
        required: true
        default: 'v0.2.0-rc.1'
      create_draft:
        description: 'Create a draft GitHub Release after all checks pass (main only)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: candidate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/full-integration.yml

  package:
    if: always() && (github.event_name == 'pull_request' || needs.gate.result == 'success')
    needs: [gate]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: '8.14.3'
      - name: Validate version and packaging boundaries
        env:
          CANDIDATE_VERSION: ${{ inputs.version }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          python3 scripts/verify_build_pins.py
          python3 -m unittest discover -s scripts -p test_package_candidate.py
          python3 - <<'PYTHON'
          import os, sys
          sys.path.insert(0, 'scripts')
          from package_candidate import version_name
          version = os.environ['CANDIDATE_VERSION'] if os.environ['EVENT_NAME'] == 'workflow_dispatch' else 'v0.0.0-rc.' + os.environ['GITHUB_RUN_NUMBER']
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('TVNEXT_CANDIDATE_VERSION=' + version_name(version) + '\n')
          PYTHON
      - name: Build audited Web and API artifacts
        run: |
          set -euo pipefail
          npm --prefix apps/web ci --no-audit --no-fund
          npm --prefix apps/web audit --audit-level=moderate --json > apps/web/npm-audit.json
          npm --prefix apps/web sbom --sbom-format cyclonedx > apps/web/sbom-web.cdx.json
          npm --prefix apps/web run build
          gradle -p services/api bootJar --no-daemon "-PreleaseVersion=${TVNEXT_CANDIDATE_VERSION#v}"
      - name: Build and archive native Linux images
        run: |
          set -euo pipefail
          docker build --platform linux/amd64 --build-arg "TVNEXT_RELEASE_VERSION=${TVNEXT_CANDIDATE_VERSION#v}" --label "org.opencontainers.image.revision=$GITHUB_SHA" -t "tvnext/api:$TVNEXT_CANDIDATE_VERSION" services/api
          docker build --platform linux/amd64 --label "org.opencontainers.image.revision=$GITHUB_SHA" -t "tvnext/web:$TVNEXT_CANDIDATE_VERSION" apps/web
          # The host and pinned container builder compile independently from
          # different roots/JDK installations. A candidate must not silently
          # ship a different API binary in its Docker image and JAR attachment.
          jars=(services/api/build/libs/*.jar)
          test "${#jars[@]}" -eq 1
          candidate_container="tvnext-candidate-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          trap 'docker rm -f "$candidate_container" >/dev/null 2>&1 || true' EXIT
          docker create --name "$candidate_container" "tvnext/api:$TVNEXT_CANDIDATE_VERSION" > /dev/null
          docker cp "$candidate_container:/app/api.jar" /tmp/tvnext-container-api.jar
          cmp "${jars[0]}" /tmp/tvnext-container-api.jar
          sha256sum "${jars[0]}" /tmp/tvnext-container-api.jar
          docker rm -f "$candidate_container" > /dev/null
          trap - EXIT
          docker image inspect "tvnext/api:$TVNEXT_CANDIDATE_VERSION" "tvnext/web:$TVNEXT_CANDIDATE_VERSION" > /tmp/tvnext-image-inspection.json
          python3 - <<'PYTHON'
          import json
          from pathlib import Path
          images = json.loads(Path('/tmp/tvnext-image-inspection.json').read_text())
          Path('/tmp/tvnext-image-ids.json').write_text(json.dumps(dict(zip(('api', 'web'), (image['Id'] for image in images)))))
          PYTHON
          docker save "tvnext/api:$TVNEXT_CANDIDATE_VERSION" "tvnext/web:$TVNEXT_CANDIDATE_VERSION" | gzip -n > /tmp/tvnext-images.tar.gz
          # Exercise the distributed archive, including exact preserved image identities.
          docker image rm "tvnext/api:$TVNEXT_CANDIDATE_VERSION" "tvnext/web:$TVNEXT_CANDIDATE_VERSION"
          gzip -dc /tmp/tvnext-images.tar.gz | docker load
          docker run --rm --entrypoint java "tvnext/api:$TVNEXT_CANDIDATE_VERSION" -version
          docker run --rm "tvnext/web:$TVNEXT_CANDIDATE_VERSION" nginx -v
      - name: Package source, binaries, image identities and SHA-256 evidence
        run: |
          set -euo pipefail
          jars=(services/api/build/libs/*.jar)
          test "${#jars[@]}" -eq 1
          python3 scripts/package_candidate.py --version "$TVNEXT_CANDIDATE_VERSION" --output candidate \
            --jar "${jars[0]}" --images /tmp/tvnext-images.tar.gz --image-ids /tmp/tvnext-image-ids.json
          cd candidate
          sha256sum --check SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unsigned-release-candidate-${{ github.run_id }}
          path: candidate/
          retention-days: 14

  draft:
    if: github.event_name == 'workflow_dispatch' && inputs.create_draft && github.ref == 'refs/heads/main'
    needs: [gate, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Create reviewable draft with complete candidate attachments
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          gh run download "$GITHUB_RUN_ID" --name "unsigned-release-candidate-$GITHUB_RUN_ID" --dir candidate
          cd candidate
          sha256sum --check SHA256SUMS
          cd ..
          gh release create "$CANDIDATE_VERSION" candidate/* --draft --target "$GITHUB_SHA" \
            --title "TV-Next $CANDIDATE_VERSION (unsigned candidate)" --notes-file docs/RELEASE_CANDIDATES.md
