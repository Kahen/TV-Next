name: Spider Fixture Isolation CI

on:
  push:
    branches: [main, "feat/**"]
    paths:
      - "services/spider-runtime/**"
      - ".github/workflows/spider-sandbox.yml"
  pull_request:
    paths:
      - "services/spider-runtime/**"
      - ".github/workflows/spider-sandbox.yml"
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fixture-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify shared Android init binding fingerprints
        run: python3 -m unittest discover -s scripts -p test_spider_binding.py -v
      - name: Build immutable demonstration runtimes
        run: |
          docker build -f services/spider-runtime/node/Dockerfile -t tvnext/spider-node-fixture:ci services/spider-runtime
          docker build -f services/spider-runtime/python/Dockerfile -t tvnext/spider-python-fixture:ci services/spider-runtime
          docker build -f services/spider-runtime/java/Dockerfile -t tvnext/spider-java-fixture:ci services/spider-runtime
      - name: Validate bytecode inspector against Android/JNI/malformed JAR fixtures
        working-directory: services/spider-runtime
        run: python3 -m unittest -v test_jar_inspect
      - name: Inspect compiled bundled Java JAR without execution
        run: |
          id="$(docker create tvnext/spider-java-fixture:ci)"
          trap 'docker rm -f "$id" >/dev/null 2>&1 || true' EXIT
          docker cp "$id:/worker/tvnext-fixture.jar" "$RUNNER_TEMP/tvnext-fixture.jar"
          python3 services/spider-runtime/jar_inspect.py "$RUNNER_TEMP/tvnext-fixture.jar"
      - name: Exercise OS isolation, protocol parity, network, filesystem and timeout
        working-directory: services/spider-runtime
        run: python3 -m unittest -v test_runtime
      - name: Detect leaked runtime containers
        if: always()
        run: |
          if [ -n "$(docker ps -aq --filter 'name=tvnext-fixture-')" ]; then
            docker ps -a --filter 'name=tvnext-fixture-'
            docker ps -aq --filter 'name=tvnext-fixture-' | xargs -r docker rm -f
            exit 1
          fi
