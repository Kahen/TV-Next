name: Web and API CI

on:
  push:
    branches:
      - main
      - feat/**
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --no-audit --no-fund
      - name: Audit all locked Web dependencies
        run: npm audit --audit-level=moderate --json > npm-audit.json
      - name: Generate Web dependency SBOM
        run: npm sbom --sbom-format cyclonedx > sbom-web.cdx.json
      - name: Preserve dependency audit and SBOM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-dependency-evidence
          path: |
            apps/web/npm-audit.json
            apps/web/sbom-web.cdx.json
          retention-days: 14
      - run: npm run test
      - run: npm run build
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - run: gradle test bootJar --no-daemon
      - name: Publish exact API test counts
        if: always()
        run: python ../../scripts/summarize_junit.py build/test-results/test
      - name: Preserve API regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-reports
          path: |
            services/api/build/test-results/test
            services/api/build/reports/tests/test
          retention-days: 14

  postgres:
    name: PostgreSQL migration and account/remote integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: tvnext_test
          POSTGRES_PASSWORD: tvnext_fixture_only
          POSTGRES_DB: tvnext_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tvnext_test -d tvnext_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: services/api
    env:
      TV_NEXT_TEST_DB_URL: jdbc:postgresql://127.0.0.1:5432/tvnext_test
      TV_NEXT_DB_USER: tvnext_test
      TV_NEXT_DB_PASSWORD: tvnext_fixture_only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - run: gradle test --tests '*HomeServerIntegrationTest' --tests '*RemoteControlIntegrationTest' --tests '*EpgFeedIntegrationTest' --no-daemon
      - name: Publish PostgreSQL test evidence
        if: always()
        run: python ../../scripts/summarize_junit.py build/test-results/test
