name: Web and API CI

on:
  push:
    branches:
      - main
      - feat/**
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify immutable build inputs
        working-directory: .
        run: |
          python3 scripts/verify_build_pins.py
          python3 -m unittest discover -s scripts -p test_verify_build_pins.py
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - run: npm ci --no-audit --no-fund
      - name: Audit all locked Web dependencies
        run: npm audit --audit-level=moderate --json > npm-audit.json
      - name: Generate Web dependency SBOM
        run: npm sbom --sbom-format cyclonedx > sbom-web.cdx.json
      - name: Preserve dependency audit and SBOM
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-dependency-evidence
          path: |
            apps/web/npm-audit.json
            apps/web/sbom-web.cdx.json
          retention-days: 14
      - run: npm run test
      - run: npm run build
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: "8.14.3"
      - name: Verify committed JVM dependency evidence
        working-directory: .
        run: |
          python3 scripts/verify_gradle_dependencies.py
          python3 -m unittest discover -s scripts -p test_verify_gradle_dependencies.py
          python3 -m unittest discover -s scripts -p test_generate_jvm_sbom.py
      - run: gradle test bootJar --dependency-verification strict --no-daemon
      - name: Inventory exact shipped JVM libraries
        working-directory: .
        run: |
          jars=(services/api/build/libs/*.jar)
          test "${#jars[@]}" -eq 1
          python3 scripts/generate_jvm_sbom.py --jar "${jars[0]}" --version 0.1.0-SNAPSHOT --output services/api/build/reports/sbom-api.cdx.json
      - name: Preserve JVM dependency evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: api-dependency-evidence
          path: |
            services/api/build/reports/sbom-api.cdx.json
            services/api/gradle.lockfile
            services/api/gradle/verification-metadata.xml
          retention-days: 14
      - name: Publish exact API test counts
        if: always()
        run: python ../../scripts/summarize_junit.py build/test-results/test
      - name: Preserve API regression evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: api-test-reports
          path: |
            services/api/build/test-results/test
            services/api/build/reports/tests/test
          retention-days: 14

  postgres:
    name: PostgreSQL migration and account/remote integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
        env:
          POSTGRES_USER: tvnext_test
          POSTGRES_PASSWORD: tvnext_fixture_only
          POSTGRES_DB: tvnext_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tvnext_test -d tvnext_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: services/api
    env:
      TV_NEXT_TEST_DB_URL: jdbc:postgresql://127.0.0.1:5432/tvnext_test
      TV_NEXT_DB_USER: tvnext_test
      TV_NEXT_DB_PASSWORD: tvnext_fixture_only
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: "8.14.3"
      - run: gradle test --dependency-verification strict --tests '*HomeServerIntegrationTest' --tests '*RemoteControlIntegrationTest' --tests '*EpgFeedIntegrationTest' --no-daemon
      - name: Publish PostgreSQL test evidence
        if: always()
        run: python ../../scripts/summarize_junit.py build/test-results/test
