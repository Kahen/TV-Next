openapi: 3.1.0
info:
  title: TV-Next API
  version: 0.3.1-preview
  description: Bounded offline imports plus DNS-pinned TVBox/FongMi type 0/1/2/4 subscription
    and AList/OpenList metadata operations. Optional administrator-approved stateless type 3
    media methods delegate to a separate Android host and require device authentication;
    arbitrary plugin activation and arbitrary media forwarding are not implemented. Authenticated bounded HTTP/HLS relay
    and original live timeshift/programme catchup subsets are available. Network destinations are public by default;
    explicit LAN origins are configured by the administrator. POST envelopes are limited
    to 3 MiB and peers to 300 requests/minute. Home accounts, device pairing, revision-based
    library synchronization and one-use WebSocket ticket endpoints are opt-in; registration
    is disabled by default.
servers:
- url: http://localhost:8080
paths:
  /api/v1/health:
    get:
      summary: Health probe
      responses:
        '200':
          description: Service is accepting requests
  /api/v1/playlists/parse:
    post:
      summary: Normalize a user-provided M3U playlist (HTTP/S entries only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TextImportRequest'
      responses:
        '200':
          description: Parsed channels; invalid/non-HTTP entries omitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaylistResponse'
        '400':
          description: Bad input or size limits
  /api/v1/configs/inspect:
    post:
      summary: Inspect FongMi-style JSON without executing configured scripts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TextImportRequest'
      responses:
        '200':
          description: Site and live group descriptors
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigPreview'
        '400':
          description: Invalid JSON or size limits
  /api/v1/catalog/preview:
    post:
      summary: Normalize FongMi sites and live groups without fetching sources or
        executing Spider
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TextImportRequest'
      responses:
        '200':
          description: Static site descriptors and live channel groups with optional
            plain HTTP(S) direct URLs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogPreview'
        '400':
          description: Invalid or oversized config
  /api/v1/media/home:
    post:
      summary: Browse user-pasted FongMi Result (static only; no network calls)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MediaQuery'
      responses:
        '200':
          description: Categories and paginated items
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaPage'
        '400':
          description: Invalid media JSON or pagination
  /api/v1/media/category:
    post:
      summary: Filter imported items by categoryId
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MediaQuery'
      responses:
        '200':
          description: Filtered page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaPage'
        '400':
          description: Invalid category
  /api/v1/media/search:
    post:
      summary: Local title search within imported Result JSON
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MediaQuery'
      responses:
        '200':
          description: Matching items
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaPage'
        '400':
          description: Invalid search query
  /api/v1/media/detail:
    post:
      summary: Read imported video metadata, lines and episodes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MediaQuery'
      responses:
        '200':
          description: Static video details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaDetail'
        '400':
          description: Invalid request
        '404':
          description: Video not present in JSON
  /api/v1/media/play:
    post:
      summary: Return plain imported HTTP(S) episode URL (no proxying)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MediaQuery'
      responses:
        '200':
          description: Direct playback URL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaPlayback'
        '400':
          description: Invalid episode selection
        '404':
          description: Video not present
        '422':
          description: Unsupported parser required
  /api/v1/epg/guide:
    post:
      summary: Match uploaded XMLTV to imported M3U channels (offline, no URL fetching)
      description: 'Parses an explicitly provided XMLTV document with external XML
        entities and DTDs

        disabled. Matches tvg-id first, then unique XMLTV display-name. No remote
        feed

        fetching, persistence, EPG subscription or streaming is performed.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EpgGuideRequest'
      responses:
        '200':
          description: Current and upcoming programmes for requested channels
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EpgGuideResponse'
        '400':
          description: Invalid XML, forbidden DOCTYPE, timestamps or request limits
        '503':
          description: Secure XML parser unavailable
  /api/v1/subscriptions/load:
    post:
      summary: Decode and normalize an original TVBox subscription or depot
      description: IDNA DNS names and binary image-prefixed Base64 configurations
        are accepted. Java-style JSON comments are subscription-specific; decoded
        JSON remains strict UTF-8. Loading metadata never executes a Spider.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscriptionRequest'
      responses:
        '200':
          description: Successful result
          content:
            application/json:
              schema:
                type: object
                required:
                - content
                - url
                - sites
                - depots
                - liveCount
                - warnings
                properties:
                  sites:
                    type: array
                    maxItems: 1000
                    items:
                      type: object
                      required: [key, type, support]
                      properties:
                        key:
                          type: string
                          maxLength: 200
                        type:
                          type: integer
                        support:
                          type: string
                          enum: [xml-api, json-api, http-spider, requires-spider-runtime, android-spider, unsupported-type]
                          description: android-spider indicates a configured approved binding, not verified host reachability or actual provider compatibility.
        '400':
          description: Invalid input or semantic limit
        '413':
          description: Envelope exceeds 3 MiB
        '422':
          description: Unsupported provider/parser capability
        '429':
          description: Request/concurrency limit
        '502':
          description: Provider transport, denied destination or invalid upstream
            response
  /api/v1/subscriptions/home:
    post:
      summary: Original SiteApi home operation
      description: Type 0/1/2/4 operations remain available without login. Type 3
        requires a valid device bearer and an exact administrator-approved Android
        binding; only stateless direct HTTP(S) media results are supported.
      security:
      - {}
      - deviceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SiteRequest'
      responses:
        '200':
          description: Successful result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaPage'
        '400':
          description: Invalid input or semantic limit
        '401':
          description: Missing type-3 device bearer or invalid, expired or revoked supplied bearer
        '408':
          description: Android Spider operation interrupted
        '504':
          description: Android Spider request budget expired
        '413':
          description: Envelope exceeds 3 MiB
        '422':
          description: Unsupported provider/parser capability
        '429':
          description: Request/concurrency limit
        '502':
          description: Provider transport, denied destination or invalid upstream
            response
  /api/v1/subscriptions/category:
    post:
      summary: Original HTTP or approved Android Spider category and filters
      description: Type 0/1/2/4 operations remain available without login. Type 3
        requires a valid device bearer and an exact administrator-approved Android
        binding; only stateless direct HTTP(S) media results are supported.
      security:
      - {}
      - deviceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SiteRequest'
      responses:
        '200':
          description: Successful result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaPage'
        '400':
          description: Invalid input or semantic limit
        '401':
          description: Missing type-3 device bearer or invalid, expired or revoked supplied bearer
        '408':
          description: Android Spider operation interrupted
        '504':
          description: Android Spider request budget expired
        '413':
          description: Envelope exceeds 3 MiB
        '422':
          description: Unsupported provider/parser capability
        '429':
          description: Request/concurrency limit
        '502':
          description: Provider transport, denied destination or invalid upstream
            response
  /api/v1/subscriptions/search:
    post:
      summary: Original wd/quick/pg search semantics
      description: Type 0/1/2/4 operations remain available without login. Type 3
        requires a valid device bearer and an exact administrator-approved Android
        binding; only stateless direct HTTP(S) media results are supported.
      security:
      - {}
      - deviceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SiteRequest'
      responses:
        '200':
          description: Successful result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaPage'
        '400':
          description: Invalid input or semantic limit
        '401':
          description: Missing type-3 device bearer or invalid, expired or revoked supplied bearer
        '408':
          description: Android Spider operation interrupted
        '504':
          description: Android Spider request budget expired
        '413':
          description: Envelope exceeds 3 MiB
        '422':
          description: Unsupported provider/parser capability
        '429':
          description: Request/concurrency limit
        '502':
          description: Provider transport, denied destination or invalid upstream
            response
  /api/v1/subscriptions/detail:
    post:
      summary: Video or cloud directory item details
      description: Type 0/1/2/4 operations remain available without login. Type 3
        requires a valid device bearer and an exact administrator-approved Android
        binding; only stateless direct HTTP(S) media results are supported.
      security:
      - {}
      - deviceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SiteRequest'
      responses:
        '200':
          description: Successful result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaDetail'
        '400':
          description: Invalid input or semantic limit
        '401':
          description: Missing type-3 device bearer or invalid, expired or revoked supplied bearer
        '408':
          description: Android Spider operation interrupted
        '504':
          description: Android Spider request budget expired
        '413':
          description: Envelope exceeds 3 MiB
        '422':
          description: Unsupported provider/parser capability
        '429':
          description: Request/concurrency limit
        '502':
          description: Provider transport, denied destination or invalid upstream
            response
  /api/v1/subscriptions/play:
    post:
      summary: Resolve opaque type 4 cloud IDs and preserve playback resources
      description: Type 0/1/2/4 operations remain available without login. Type 3
        requires a valid device bearer and an exact administrator-approved Android
        binding; only stateless direct HTTP(S) media results are supported.
      security:
      - {}
      - deviceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SiteRequest'
      responses:
        '200':
          description: Successful result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaPlayback'
        '400':
          description: Invalid input or semantic limit
        '401':
          description: Missing type-3 device bearer or invalid, expired or revoked supplied bearer
        '408':
          description: Android Spider operation interrupted
        '504':
          description: Android Spider request budget expired
        '413':
          description: Envelope exceeds 3 MiB
        '422':
          description: Unsupported provider/parser capability
        '429':
          description: Request/concurrency limit
        '502':
          description: Provider transport, denied destination or invalid upstream
            response
  /api/v1/subscriptions/action:
    post:
      summary: Fetch a type 4 action result as JSON; no UI script execution
      description: Type 3 requests require device authentication but interactive
        Spider actions are not implemented and return 422 after authentication.
      security:
      - {}
      - deviceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SiteRequest'
      responses:
        '200':
          description: Successful result
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Invalid input or semantic limit
        '401':
          description: Missing type-3 device bearer or invalid, expired or revoked supplied bearer
        '408':
          description: Android Spider operation interrupted
        '504':
          description: Android Spider request budget expired
        '413':
          description: Envelope exceeds 3 MiB
        '422':
          description: Unsupported provider/parser capability
        '429':
          description: Request/concurrency limit
        '502':
          description: Provider transport, denied destination or invalid upstream
            response
  /api/v1/subscriptions/replay:
    post:
      summary: Resolve original FongMi timeshift Result or programme Catchup into a private media capability
      security:
      - deviceBearer: []
      description: Times are Unix milliseconds. time=0 and omitted stop returns to live; timeshift RPCs return Result JSON, not media. stop selects the separate programme catchup path. Replay capabilities and templates must not enter persisted libraries.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LiveReplayRequest'
      responses:
        '200':
          description: Registered media capability; Cache-Control no-store, private
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiveReplaySession'
        '400':
          description: Invalid declaration, timezone or timestamp outside explicit provider range
        '401':
          description: Missing, expired or revoked device token
        '422':
          description: Unsupported catchup mode, template, origin, parser or DRM
        '429':
          description: Request, provider or media-session quota exceeded
        '502':
          description: Denied provider destination or invalid timeshift Result
  /api/v1/subscriptions/live:
    post:
      summary: Import inline or referenced M3U/TXT/group-JSON live channels
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LiveImportRequest'
      responses:
        '200':
          description: Successful result
          content:
            application/json:
              schema:
                type: object
                properties:
                  channels:
                    type: array
                    items:
                      $ref: '#/components/schemas/Channel'
                  total:
                    type: integer
                  warnings:
                    type: array
                    items:
                      type: string
        '400':
          description: Invalid input or semantic limit
        '413':
          description: Envelope exceeds 3 MiB
        '422':
          description: Unsupported provider/parser capability
        '429':
          description: Request/concurrency limit
        '502':
          description: Provider transport, denied destination or invalid upstream
            response
  /api/v1/cloud/list:
    post:
      summary: AList/OpenList paginated directory listing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CloudRequest'
      responses:
        '200':
          description: Successful result
          content:
            application/json:
              schema:
                type: object
                required:
                - path
                - entries
                - page
                - hasMore
        '400':
          description: Invalid input or semantic limit
        '413':
          description: Envelope exceeds 3 MiB
        '422':
          description: Unsupported provider/parser capability
        '429':
          description: Request/concurrency limit
        '502':
          description: Provider transport, denied destination or invalid upstream
            response
  /api/v1/cloud/play:
    post:
      summary: Get the user-authorized cloud raw or signed media URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CloudRequest'
      responses:
        '200':
          description: Successful result
          content:
            application/json:
              schema:
                type: object
                required:
                - name
                - url
                - headers
        '400':
          description: Invalid input or semantic limit
        '413':
          description: Envelope exceeds 3 MiB
        '422':
          description: Unsupported provider/parser capability
        '429':
          description: Request/concurrency limit
        '502':
          description: Provider transport, denied destination or invalid upstream
            response
  /api/v1/resources/text:
    post:
      summary: Fetch bounded UTF-8 subtitles or danmaku text
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResourceRequest'
      responses:
        '200':
          description: Successful result
          content:
            application/json:
              schema:
                type: object
                required:
                - content
                properties:
                  content:
                    type: string
                    maxLength: 1048576
        '400':
          description: Invalid input or semantic limit
        '413':
          description: Envelope exceeds 3 MiB
        '422':
          description: Unsupported provider/parser capability
        '429':
          description: Request/concurrency limit
        '502':
          description: Provider transport, denied destination or invalid upstream
            response
  /api/v1/home/auth/register:
    post:
      summary: Create an account only while administrator registration is enabled
      security: []
      responses:
        '200':
          description: Successful result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HomeSession'
        '400':
          description: Invalid input
        '401':
          description: Missing, revoked or expired credentials/code
        '403':
          description: Registration disabled
        '404':
          description: Unknown owned resource
        '409':
          description: Revision conflict, device quota or offline target
        '429':
          description: Request/connection limit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Credentials'
  /api/v1/home/auth/login:
    post:
      summary: Authenticate and issue a 90-day device token
      security: []
      responses:
        '200':
          description: Successful result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HomeSession'
        '400':
          description: Invalid input
        '401':
          description: Missing, revoked or expired credentials/code
        '403':
          description: Registration disabled
        '404':
          description: Unknown owned resource
        '409':
          description: Revision conflict, device quota or offline target
        '429':
          description: Request/connection limit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Credentials'
  /api/v1/home/media/sessions:
    post:
      summary: Create an expiring device-bound media capability
      description: Only registered HTTP(S) resources can be fetched. Source headers remain in memory. Playback URLs contain a separate capability, never the device bearer token.
      security:
      - deviceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MediaRelayRequest'
      responses:
        '200':
          description: Relative playback path and absolute session expiry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaRelaySession'
        '400':
          description: Invalid URL or request headers
        '401':
          description: Missing or revoked device bearer
        '429':
          description: Global session limit
  /api/v1/home/media/{ticket}/close:
    post:
      summary: Close a media session created by the current device
      security:
      - deviceBearer: []
      parameters:
      - $ref: '#/components/parameters/MediaTicket'
      responses:
        '200':
          description: Session closed or already absent
        '401':
          description: Invalid device credentials
        '404':
          description: Session belongs to another device
  /api/v1/home/media/{ticket}/{resource}:
    parameters:
    - $ref: '#/components/parameters/MediaTicket'
    - name: resource
      in: path
      required: true
      schema:
        type: string
        pattern: '^[0-9]{1,4}$'
    get:
      summary: Read a registered media resource using its expiring capability
      description: Single byte ranges are capped at 8 MiB; bodies at 32 MiB; HLS manifests at 1 MiB. Same-origin headers only, DNS pinned at each hop. 4 concurrent transfers globally, 4 GiB per session, 6-hour absolute and 30-minute idle expiry. No arbitrary URL parameter is accepted.
      security: []
      parameters:
      - name: Range
        in: header
        schema:
          type: string
          maxLength: 40
      responses:
        '200':
          description: Binary resource or rewritten UTF-8 HLS playlist
        '206':
          description: Validated single byte range
        '401':
          description: Capability expired, closed or device revoked
        '404':
          description: Resource was not registered in this session
        '416':
          description: Invalid or unsatisfiable range
        '429':
          description: Transfer, connection or session request quota
        '502':
          description: Unsupported media, denied address, redirect or bounded upstream failure
    head:
      summary: Inspect registered media metadata without transferring its body
      security: []
      responses:
        '200':
          description: Media metadata
        '401':
          description: Capability expired or revoked
        '502':
          description: Upstream metadata unavailable
  /api/v1/home/providers/health:
    get:
      summary: Read only the current device's observed provider health
      security:
      - deviceBearer: []
      responses:
        '200':
          description: Bounded per-device counters; no URLs, queries, headers or credentials
          content:
            application/json:
              schema:
                type: array
                maxItems: 32
                items:
                  $ref: '#/components/schemas/ProviderHealth'
        '401':
          description: Missing or revoked device token
  /api/v1/home/providers/clear:
    post:
      summary: Clear this device's health and search cache, invalidating pending writes
      security:
      - deviceBearer: []
      responses:
        '200':
          description: Device-private cache and observations cleared
        '401':
          description: Missing or revoked device token
  /api/v1/home/diagnostics:
    get:
      summary: Read aggregate process counters and only this user's device/library
        totals
      security:
      - deviceBearer: []
      responses:
        '200':
          description: Aggregate diagnostics without tokens, media URLs or other users'
            data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HomeDiagnostics'
        '401':
          description: Missing, revoked or expired credentials
        '429':
          description: Request or concurrency limit
  /api/v1/home/devices:
    get:
      summary: List this user's active devices
      security:
      - deviceBearer: []
      responses:
        '200':
          description: Successful result
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HomeDevice'
        '400':
          description: Invalid input
        '401':
          description: Missing, revoked or expired credentials/code
        '403':
          description: Registration disabled
        '404':
          description: Unknown owned resource
        '409':
          description: Revision conflict, device quota or offline target
        '429':
          description: Request/connection limit
  /api/v1/home/devices/{id}/revoke:
    post:
      summary: Revoke an owned device and close its remote channel
      security:
      - deviceBearer: []
      responses:
        '200':
          description: Successful result
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Invalid input
        '401':
          description: Missing, revoked or expired credentials/code
        '403':
          description: Registration disabled
        '404':
          description: Unknown owned resource
        '409':
          description: Revision conflict, device quota or offline target
        '429':
          description: Request/connection limit
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          maxLength: 36
  /api/v1/home/pairings:
    post:
      summary: Create a five-minute one-use pairing code
      security:
      - deviceBearer: []
      responses:
        '200':
          description: Successful result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PairingCode'
        '400':
          description: Invalid input
        '401':
          description: Missing, revoked or expired credentials/code
        '403':
          description: Registration disabled
        '404':
          description: Unknown owned resource
        '409':
          description: Revision conflict, device quota or offline target
        '429':
          description: Request/connection limit
  /api/v1/home/pairings/claim:
    post:
      summary: Claim a new device using a one-use pairing code
      security: []
      responses:
        '200':
          description: Successful result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HomeSession'
        '400':
          description: Invalid input
        '401':
          description: Missing, revoked or expired credentials/code
        '403':
          description: Registration disabled
        '404':
          description: Unknown owned resource
        '409':
          description: Revision conflict, device quota or offline target
        '429':
          description: Request/connection limit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PairingRequest'
  /api/v1/home/library:
    get:
      summary: Read the user-scoped library and revision
      security:
      - deviceBearer: []
      responses:
        '200':
          description: Successful result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncedLibrary'
        '400':
          description: Invalid input
        '401':
          description: Missing, revoked or expired credentials/code
        '403':
          description: Registration disabled
        '404':
          description: Unknown owned resource
        '409':
          description: Revision conflict, device quota or offline target
        '429':
          description: Request/connection limit
    post:
      summary: Atomically update only the expected library revision
      security:
      - deviceBearer: []
      responses:
        '200':
          description: Successful result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncedLibrary'
        '400':
          description: Invalid input
        '401':
          description: Missing, revoked or expired credentials/code
        '403':
          description: Registration disabled
        '404':
          description: Unknown owned resource
        '409':
          description: Revision conflict, device quota or offline target
        '429':
          description: Request/connection limit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveLibraryRequest'
  /api/v1/home/remote/ticket:
    post:
      summary: Issue a 30-second one-use WebSocket ticket
      security:
      - deviceBearer: []
      responses:
        '200':
          description: Successful result
          content:
            application/json:
              schema:
                type: object
                required:
                - ticket
                - expiresAt
        '400':
          description: Invalid input
        '401':
          description: Missing, revoked or expired credentials/code
        '403':
          description: Registration disabled
        '404':
          description: Unknown owned resource
        '409':
          description: Revision conflict, device quota or offline target
        '429':
          description: Request/connection limit
  /api/v1/home/remote/devices:
    get:
      summary: List owned devices and remote connection status
      security:
      - deviceBearer: []
      responses:
        '200':
          description: Successful result
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
        '400':
          description: Invalid input
        '401':
          description: Missing, revoked or expired credentials/code
        '403':
          description: Registration disabled
        '404':
          description: Unknown owned resource
        '409':
          description: Revision conflict, device quota or offline target
        '429':
          description: Request/connection limit
  /api/v1/home/remote/commands:
    post:
      summary: Send a bounded command to an online device of this account
      security:
      - deviceBearer: []
      responses:
        '200':
          description: Successful result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RemoteStatus'
        '400':
          description: Invalid input
        '401':
          description: Missing, revoked or expired credentials/code
        '403':
          description: Registration disabled
        '404':
          description: Unknown owned resource
        '409':
          description: Revision conflict, device quota or offline target
        '429':
          description: Request/connection limit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RemoteRequest'
  /api/v1/home/remote/commands/{id}:
    get:
      summary: Read sender-owned command delivery/ACK state for five minutes
      security:
      - deviceBearer: []
      responses:
        '200':
          description: Successful result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RemoteStatus'
        '400':
          description: Invalid input
        '401':
          description: Missing, revoked or expired credentials/code
        '403':
          description: Registration disabled
        '404':
          description: Unknown owned resource
        '409':
          description: Revision conflict, device quota or offline target
        '429':
          description: Request/connection limit
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          maxLength: 36
  /api/v1/home/epg/feeds:
    get:
      summary: List current account EPG feeds
      security: &id001
      - deviceBearer: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EpgFeedStatus'
        '401':
          description: Expired or revoked device token
        '404':
          description: Unknown or unavailable account feed
        '429':
          description: Concurrent refresh or retry within one minute
    post:
      summary: Create a saved XMLTV or XMLTV.gz subscription
      security: *id001
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EpgFeedStatus'
        '401':
          description: Expired or revoked device token
        '404':
          description: Unknown or unavailable account feed
        '429':
          description: Concurrent refresh or retry within one minute
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EpgFeedWrite'
  /api/v1/home/epg/feeds/{id}/refresh:
    post:
      summary: Attempt refresh; lastError reports retained-cache failures
      security: *id001
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EpgFeedStatus'
        '401':
          description: Expired or revoked device token
        '404':
          description: Unknown or unavailable account feed
        '429':
          description: Concurrent refresh or retry within one minute
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
  /api/v1/home/epg/feeds/{id}/remove:
    post:
      summary: Remove saved feed and cache
      security: *id001
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted:
                    type: boolean
        '401':
          description: Expired or revoked device token
        '404':
          description: Unknown or unavailable account feed
        '429':
          description: Concurrent refresh or retry within one minute
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
  /api/v1/home/epg/feeds/{id}/guide:
    post:
      summary: Match cached XMLTV to supplied playlist channels
      security: *id001
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EpgGuideResponse'
        '401':
          description: Expired or revoked device token
        '404':
          description: Unknown or unavailable account feed
        '429':
          description: Concurrent refresh or retry within one minute
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EpgFeedGuideRequest'
components:
  parameters:
    MediaTicket:
      name: ticket
      in: path
      required: true
      schema:
        type: string
        pattern: '^[A-Za-z0-9_-]{43}$'
  schemas:
    TextImportRequest:
      type: object
      required:
      - content
      properties:
        content:
          type: string
          maxLength: 1048576
    Channel:
      type: object
      required:
      - name
      - url
      - group
      properties:
        name:
          type: string
        url:
          type: string
          format: uri
        group:
          type: string
        logo:
          type:
          - string
          - 'null'
        tvgId:
          type:
          - string
          - 'null'
        headers: &id002
          type: object
          maxProperties: 32
          additionalProperties:
            type: string
            maxLength: 8192
        timeshift:
          anyOf:
          - $ref: '#/components/schemas/LiveTimeshift'
          - type: 'null'
        catchup:
          anyOf:
          - $ref: '#/components/schemas/LiveCatchup'
          - type: 'null'
    PlaylistResponse:
      type: object
      required:
      - channels
      - total
      properties:
        total:
          type: integer
        channels:
          type: array
          items:
            $ref: '#/components/schemas/Channel'
    SitePreview:
      type: object
      required:
      - key
      - name
      properties:
        key:
          type: string
        name:
          type: string
        type:
          type:
          - integer
          - 'null'
    ConfigPreview:
      type: object
      required:
      - spiderDeclared
      - sites
      - liveGroupCount
      properties:
        spiderDeclared:
          type: boolean
        liveGroupCount:
          type: integer
        sites:
          type: array
          items:
            $ref: '#/components/schemas/SitePreview'
    CatalogPreview:
      type: object
      required:
      - sites
      - liveSources
      - directPlayableChannelCount
      - warnings
      properties:
        sites:
          type: array
          items:
            type: object
            required:
            - key
            - name
            - searchable
            - hidden
            - categories
            - mode
            properties:
              key:
                type: string
              name:
                type: string
              type:
                type:
                - integer
                - 'null'
              searchable:
                type: boolean
              hidden:
                type: boolean
              categories:
                type: array
                items:
                  type: string
              mode:
                type: string
                const: preview-only
        liveSources:
          type: array
          items:
            type: object
            required:
            - name
            - groups
            properties:
              name:
                type: string
              groups:
                type: array
                items:
                  type: object
                  required:
                  - name
                  - channels
                  properties:
                    name:
                      type: string
                    channels:
                      type: array
                      items:
                        type: object
                        required:
                        - name
                        - directUrl
                        - sourceCount
                        properties:
                          name:
                            type: string
                          directUrl:
                            type:
                            - string
                            - 'null'
                          sourceCount:
                            type: integer
        directPlayableChannelCount:
          type: integer
        warnings:
          type: array
          items:
            type: string
    MediaQuery:
      type: object
      required:
      - content
      properties:
        content:
          type: string
          maxLength: 1048576
        categoryId:
          type: string
          maxLength: 100
        query:
          type: string
          maxLength: 120
        vodId:
          type: string
          maxLength: 200
        page:
          type: integer
          minimum: 1
          maximum: 1000
          default: 1
        pageSize:
          type: integer
          minimum: 1
          maximum: 100
          default: 40
        lineIndex:
          type: integer
          minimum: 0
          default: 0
        episodeIndex:
          type: integer
          minimum: 0
          default: 0
    MediaItem:
      type: object
      required:
      - id
      - name
      properties:
        id:
          type: string
        name:
          type: string
        categoryId:
          type:
          - string
          - 'null'
        categoryName:
          type:
          - string
          - 'null'
        poster:
          type:
          - string
          - 'null'
        remarks:
          type:
          - string
          - 'null'
        year:
          type:
          - string
          - 'null'
        folder:
          type: boolean
        action:
          type:
          - string
          - 'null'
          maxLength: 8192
    MediaPage:
      type: object
      required:
      - categories
      - items
      - total
      - page
      - pageSize
      - hasMore
      - provider
      properties:
        categories:
          type: array
          items:
            type: object
            required:
            - id
            - name
            properties:
              id:
                type: string
              name:
                type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/MediaItem'
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer
          maximum: 2000
        hasMore:
          type: boolean
        provider:
          type: string
        filters:
          type: object
          additionalProperties:
            type: array
            maxItems: 30
            items:
              $ref: '#/components/schemas/SiteFilter'
    SiteFilter:
      type: object
      required: [key, name, value]
      properties:
        key:
          type: string
          maxLength: 100
        name:
          type: string
          maxLength: 200
        init:
          type: string
          maxLength: 1000
        value:
          type: array
          maxItems: 200
          items:
            type: object
            required: [n, v]
            properties:
              n:
                type: string
                maxLength: 200
              v:
                type: string
                maxLength: 1000
    MediaDetail:
      type: object
      required:
      - item
      - lines
      - provider
      properties:
        item:
          $ref: '#/components/schemas/MediaItem'
        description:
          type:
          - string
          - 'null'
        director:
          type:
          - string
          - 'null'
        actors:
          type:
          - string
          - 'null'
        provider:
          type: string
        lines:
          type: array
          items:
            type: object
            required:
            - name
            - episodes
            properties:
              name:
                type: string
              episodes:
                type: array
                items:
                  type: object
                  required:
                  - name
                  - playable
                  properties:
                    name:
                      type: string
                    playable:
                      type: boolean
    MediaPlayback:
      type: object
      required:
      - url
      - name
      - lineName
      - provider
      properties:
        url:
          type: string
          format: uri
        name:
          type: string
        lineName:
          type: string
        provider:
          type: string
        headers: *id002
        subtitles:
          type: array
          maxItems: 30
          items:
            $ref: '#/components/schemas/PlaybackResource'
        danmaku:
          type: array
          maxItems: 30
          items:
            $ref: '#/components/schemas/PlaybackResource'
        timeshift:
          anyOf:
          - $ref: '#/components/schemas/LiveTimeshift'
          - type: 'null'
    EpgGuideRequest:
      type: object
      required:
      - xml
      - channels
      properties:
        xml:
          type: string
          maxLength: 2097152
        channels:
          type: array
          minItems: 1
          maxItems: 300
          items:
            type: object
            required:
            - name
            properties:
              id:
                type:
                - string
                - 'null'
              name:
                type: string
        at:
          type:
          - string
          - 'null'
          format: date-time
        hours:
          type: integer
          minimum: 1
          maximum: 72
          default: 12
        pastHours:
          type: integer
          minimum: 0
          maximum: 168
          default: 0
    EpgProgram:
      type: object
      required:
      - start
      - stop
      - title
      properties:
        start:
          type: string
          format: date-time
        stop:
          type: string
          format: date-time
        title:
          type: string
        description:
          type:
          - string
          - 'null'
    EpgChannelGuide:
      type: object
      required:
      - name
      - matchType
      - upcoming
      properties:
        id:
          type:
          - string
          - 'null'
        name:
          type: string
        matchedChannelId:
          type:
          - string
          - 'null'
        matchType:
          type: string
          enum:
          - id
          - name
          - none
        current:
          anyOf:
          - $ref: '#/components/schemas/EpgProgram'
          - type: 'null'
        upcoming:
          type: array
          items:
            $ref: '#/components/schemas/EpgProgram'
        previous:
          type: array
          maxItems: 40
          description: Completed programmes within pastHours, newest first; independent of upcoming/current
          items:
            $ref: '#/components/schemas/EpgProgram'
    EpgGuideResponse:
      type: object
      required:
      - generatedAt
      - until
      - totalChannels
      - matchedChannels
      - channels
      - warnings
      properties:
        generatedAt:
          type: string
          format: date-time
        until:
          type: string
          format: date-time
        totalChannels:
          type: integer
        matchedChannels:
          type: integer
        channels:
          type: array
          items:
            $ref: '#/components/schemas/EpgChannelGuide'
        warnings:
          type: array
          items:
            type: string
    PlaybackResource:
      type: object
      required:
      - name
      - url
      properties:
        name:
          type: string
          maxLength: 200
        url:
          type: string
          format: uri
        lang:
          type:
          - string
          - 'null'
    SubscriptionRequest:
      type: object
      properties:
        content:
          type: string
          maxLength: 1048576
        url:
          type: string
          maxLength: 4096
      description: Provide content or URL. Optional URL supplies relative-path base.
        IDNA hosts, binary image-prefixed Base64, Java-style JSON comments and original
        AES-CBC subscriptions supported. HTTP and decoded bodies are bounded to 1 MiB;
        malformed decoded UTF-8 and trailing documents are rejected.
    SiteRequest:
      type: object
      required:
      - content
      - siteKey
      properties:
        content:
          type: string
          maxLength: 1048576
        url:
          type: string
          maxLength: 4096
        siteKey:
          type: string
          maxLength: 200
        categoryId:
          type: string
          maxLength: 4096
        query:
          type: string
          maxLength: 120
        vodId:
          type: string
          maxLength: 16384
        page:
          type: integer
          minimum: 1
          maximum: 1000
        lineIndex:
          type: integer
          minimum: 0
        episodeIndex:
          type: integer
          minimum: 0
        action:
          type: string
          maxLength: 8192
        filters:
          type: object
          maxProperties: 30
          additionalProperties:
            type: string
            maxLength: 1000
        quick:
          type: boolean
        bypassCache:
          type: boolean
          default: false
          description: Bypass this authenticated device's 60-second search cache
    CloudRequest:
      type: object
      required:
      - server
      properties:
        server:
          type: string
          maxLength: 4096
        token:
          type: string
          maxLength: 4096
        path:
          type: string
          maxLength: 4096
        password:
          type: string
          maxLength: 500
        page:
          type: integer
          minimum: 1
          maximum: 1000
      description: Credentials are per-request only and are not persisted by the server.
    ResourceRequest:
      type: object
      required:
      - url
      properties:
        url:
          type: string
          maxLength: 4096
    LiveImportRequest:
      type: object
      properties:
        content:
          type: string
          maxLength: 1048576
        url:
          type: string
          maxLength: 4096
        liveIndex:
          type: integer
          minimum: 0
          maximum: 49
    Credentials:
      type: object
      required:
      - username
      - password
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 100
        password:
          type: string
          maxLength: 128
        deviceName:
          type: string
          maxLength: 80
    MediaRelayRequest:
      type: object
      required: [url]
      properties:
        url:
          type: string
          maxLength: 4096
        headers:
          type: object
          maxProperties: 32
          additionalProperties:
            type: string
            maxLength: 16384
    MediaRelaySession:
      type: object
      required: [path, expiresAt]
      properties:
        path:
          type: string
          pattern: '^/api/v1/home/media/[A-Za-z0-9_-]{43}/0$'
        expiresAt:
          type: integer
          format: int64
    ProviderHealth:
      type: object
      properties:
        id:
          type: string
        siteKey:
          type: string
          maxLength: 200
        networkCalls:
          type: integer
          format: int64
        cacheHits:
          type: integer
          format: int64
        failures:
          type: integer
          format: int64
        lastAttemptAt:
          type: integer
          format: int64
        lastLatencyMs:
          type: integer
          format: int64
        lastSuccessAt:
          type: [integer, 'null']
        lastError:
          type: [string, 'null']
    HomeDiagnostics:
      type: object
      required:
      - uptimeSeconds
      - memoryUsedBytes
      - memoryMaxBytes
      - httpRequests
      - httpClientErrors
      - httpServerErrors
      - devices
      - onlineDevices
      - libraryRevision
      properties:
        uptimeSeconds:
          type: integer
          format: int64
          minimum: 0
        memoryUsedBytes:
          type: integer
          format: int64
          minimum: 0
        memoryMaxBytes:
          type: integer
          format: int64
          minimum: 0
        httpRequests:
          type: integer
          format: int64
          minimum: 0
        httpClientErrors:
          type: integer
          format: int64
          minimum: 0
        httpServerErrors:
          type: integer
          format: int64
          minimum: 0
        devices:
          type: integer
          format: int64
          minimum: 0
        onlineDevices:
          type: integer
          format: int64
          minimum: 0
        libraryRevision:
          type: integer
          format: int64
          minimum: 0
    HomeDevice:
      type: object
      required:
      - id
      - name
      - createdAt
      - expiresAt
      - current
      properties:
        id:
          type: string
          maxLength: 36
        name:
          type: string
          maxLength: 80
        createdAt:
          type: integer
          format: int64
        expiresAt:
          type: integer
          format: int64
        current:
          type: boolean
    HomeSession:
      type: object
      required:
      - token
      - user
      - device
      properties:
        token:
          type: string
          minLength: 43
          maxLength: 43
        user:
          type: object
          required:
          - id
          - username
          properties:
            id:
              type: string
              maxLength: 36
            username:
              type: string
              maxLength: 100
        device:
          $ref: '#/components/schemas/HomeDevice'
    LibrarySnapshot:
      type: object
      required:
      - version
      - channels
      - favorites
      - recent
      - positions
      properties:
        version:
          const: 1
        channels:
          type: array
          maxItems: 1500
          items:
            $ref: '#/components/schemas/Channel'
        favorites:
          type: array
          maxItems: 300
          items:
            type: string
            maxLength: 2048
        recent:
          type: array
          maxItems: 100
          items:
            type: object
            required:
            - channel
            - openedAt
            properties:
              channel:
                $ref: '#/components/schemas/Channel'
              openedAt:
                type: number
                minimum: 0
        positions:
          type: object
          maxProperties: 250
          additionalProperties:
            type: number
            minimum: 0
            exclusiveMaximum: 604800
    SyncedLibrary:
      type: object
      required:
      - revision
      - updatedAt
      - library
      properties:
        revision:
          type: integer
          format: int64
          minimum: 0
        updatedAt:
          type: integer
          format: int64
        library:
          $ref: '#/components/schemas/LibrarySnapshot'
    SaveLibraryRequest:
      type: object
      required:
      - expectedRevision
      - library
      properties:
        expectedRevision:
          type: integer
          format: int64
          minimum: 0
        library:
          $ref: '#/components/schemas/LibrarySnapshot'
    PairingRequest:
      type: object
      required:
      - code
      properties:
        code:
          type: string
          maxLength: 64
        deviceName:
          type: string
          maxLength: 80
    PairingCode:
      type: object
      required:
      - code
      - expiresAt
      properties:
        code:
          type: string
          maxLength: 19
        expiresAt:
          type: integer
          format: int64
    RemoteRequest:
      type: object
      required:
      - targetDeviceId
      - type
      properties:
        targetDeviceId:
          type: string
          maxLength: 36
        type:
          type: string
          enum:
          - PLAY
          - PAUSE
          - SEEK
          - LOAD
        position:
          type: number
          minimum: 0
          exclusiveMaximum: 604800
        url:
          type: string
          maxLength: 4096
    RemoteStatus:
      type: object
      required:
      - id
      - state
      properties:
        id:
          type: string
          maxLength: 36
        state:
          type: string
          enum:
          - dispatched
          - acknowledged
          - rejected
          - failed
        message:
          type:
          - string
          - 'null'
          maxLength: 200
    EpgFeedWrite:
      type: object
      required:
      - name
      - url
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        url:
          type: string
          format: uri
          maxLength: 2048
        intervalMinutes:
          type: integer
          minimum: 15
          maximum: 1440
          default: 360
        enabled:
          type: boolean
          default: true
    EpgFeedStatus:
      allOf:
      - $ref: '#/components/schemas/EpgFeedWrite'
      - type: object
        properties:
          id:
            type: string
            format: uuid
          updatedAt:
            type: integer
            format: int64
          nextRefresh:
            type: integer
            format: int64
          lastError:
            type:
            - string
            - 'null'
          available:
            type: boolean
    EpgFeedGuideRequest:
      type: object
      required:
      - channels
      properties:
        channels:
          type: array
          minItems: 1
          maxItems: 300
          items:
            type: object
            properties:
              id:
                type:
                - string
                - 'null'
              name:
                type: string
        at:
          type: string
          format: date-time
        hours:
          type: integer
          minimum: 1
          maximum: 72
          default: 12
        pastHours:
          type: integer
          minimum: 0
          maximum: 168
          default: 0
    LiveTimeshift:
      type: object
      required: [url, start, window]
      properties:
        url:
          type: string
          maxLength: 2048
          description: HTTP(S) Result endpoint with literal {time} or case-insensitive %7Btime%7D
        start:
          type: integer
          format: int64
          minimum: 1
          description: Earliest provider timestamp in Unix milliseconds
        window:
          type: integer
          format: int64
          minimum: 1
          description: Sliding window length in milliseconds; effective minimum is max(start, now-window)
    LiveCatchup:
      type: object
      required: [source]
      properties:
        type:
          type: string
          enum: [append, default]
          default: append
        days:
          type: string
          default: '7'
          description: Decimal integer 1..30
        source:
          type: string
          maxLength: 2048
        regex:
          type: string
          maxLength: 200
          description: Supported subset is a literal URL substring; provider regular expressions are rejected
        replace:
          type: string
          maxLength: 400
          description: Optional comma-separated literal from,to; no regular expressions
    LiveReplayRequest:
      type: object
      required: [channel]
      properties:
        channel:
          $ref: '#/components/schemas/Channel'
        time:
          type: integer
          format: int64
          minimum: 0
          default: 0
        stop:
          type: [integer, 'null']
          format: int64
          description: Programme end; must be greater than time and no later than server now
        timezone:
          type: string
          maxLength: 80
          default: UTC
          description: Explicit IANA zone for catchup date formats; |UTC always overrides it
    LiveReplaySession:
      type: object
      required: [path, expiresAt, hls, time]
      properties:
        path:
          type: string
          pattern: '^/api/v1/home/media/[A-Za-z0-9_-]{43}/0$'
        expiresAt:
          type: integer
          format: int64
        hls:
          type: boolean
        time:
          type: integer
          format: int64
  securitySchemes:
    deviceBearer:
      type: http
      scheme: bearer
      description: Opaque per-device token; never place it in URLs.
