openapi: 3.1.0
info:
  title: TV-Next API
  version: 0.3.0-preview
  description: Bounded offline imports plus DNS-pinned TVBox/FongMi type 0/1/2/4 subscription
    and AList/OpenList metadata operations. Type 3 remote code activation and media
    streaming proxy are not implemented. Network destinations are public by default;
    explicit LAN origins are configured by the administrator. POST envelopes are limited
    to 3 MiB and peers to 300 requests/minute. Home accounts, device pairing, revision-based
    library synchronization and one-use WebSocket ticket endpoints are opt-in; registration
    is disabled by default.
servers:
- url: http://localhost:8080
paths:
  /api/v1/health:
    get:
      summary: Health probe
      responses:
        '200':
          description: Service is accepting requests
  /api/v1/playlists/parse:
    post:
      summary: Normalize a user-provided M3U playlist (HTTP/S entries only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TextImportRequest'
      responses:
        '200':
          description: Parsed channels; invalid/non-HTTP entries omitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaylistResponse'
        '400':
          description: Bad input or size limits
  /api/v1/configs/inspect:
    post:
      summary: Inspect FongMi-style JSON without executing configured scripts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TextImportRequest'
      responses:
        '200':
          description: Site and live group descriptors
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigPreview'
        '400':
          description: Invalid JSON or size limits
  /api/v1/catalog/preview:
    post:
      summary: Normalize FongMi sites and live groups without fetching sources or
        executing Spider
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TextImportRequest'
      responses:
        '200':
          description: Static site descriptors and live channel groups with optional
            plain HTTP(S) direct URLs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogPreview'
        '400':
          description: Invalid or oversized config
  /api/v1/media/home:
    post:
      summary: Browse user-pasted FongMi Result (static only; no network calls)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MediaQuery'
      responses:
        '200':
          description: Categories and paginated items
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaPage'
        '400':
          description: Invalid media JSON or pagination
  /api/v1/media/category:
    post:
      summary: Filter imported items by categoryId
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MediaQuery'
      responses:
        '200':
          description: Filtered page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaPage'
        '400':
          description: Invalid category
  /api/v1/media/search:
    post:
      summary: Local title search within imported Result JSON
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MediaQuery'
      responses:
        '200':
          description: Matching items
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaPage'
        '400':
          description: Invalid search query
  /api/v1/media/detail:
    post:
      summary: Read imported video metadata, lines and episodes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MediaQuery'
      responses:
        '200':
          description: Static video details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaDetail'
        '400':
          description: Invalid request
        '404':
          description: Video not present in JSON
  /api/v1/media/play:
    post:
      summary: Return plain imported HTTP(S) episode URL (no proxying)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MediaQuery'
      responses:
        '200':
          description: Direct playback URL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaPlayback'
        '400':
          description: Invalid episode selection
        '404':
          description: Video not present
        '422':
          description: Unsupported parser required
  /api/v1/epg/guide:
    post:
      summary: Match uploaded XMLTV to imported M3U channels (offline, no URL fetching)
      description: 'Parses an explicitly provided XMLTV document with external XML
        entities and DTDs

        disabled. Matches tvg-id first, then unique XMLTV display-name. No remote
        feed

        fetching, persistence, EPG subscription or streaming is performed.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EpgGuideRequest'
      responses:
        '200':
          description: Current and upcoming programmes for requested channels
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EpgGuideResponse'
        '400':
          description: Invalid XML, forbidden DOCTYPE, timestamps or request limits
        '503':
          description: Secure XML parser unavailable
  /api/v1/subscriptions/load:
    post:
      summary: Decode and normalize an original TVBox subscription or depot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscriptionRequest'
      responses:
        '200':
          description: Successful result
          content:
            application/json:
              schema:
                type: object
                required:
                - content
                - url
                - sites
                - depots
                - liveCount
                - warnings
        '400':
          description: Invalid input or semantic limit
        '413':
          description: Envelope exceeds 3 MiB
        '422':
          description: Unsupported provider/parser capability
        '429':
          description: Request/concurrency limit
        '502':
          description: Provider transport, denied destination or invalid upstream
            response
  /api/v1/subscriptions/home:
    post:
      summary: Original SiteApi home operation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SiteRequest'
      responses:
        '200':
          description: Successful result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaPage'
        '400':
          description: Invalid input or semantic limit
        '413':
          description: Envelope exceeds 3 MiB
        '422':
          description: Unsupported provider/parser capability
        '429':
          description: Request/concurrency limit
        '502':
          description: Provider transport, denied destination or invalid upstream
            response
  /api/v1/subscriptions/category:
    post:
      summary: Original type 0/1/2/4 category and filters
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SiteRequest'
      responses:
        '200':
          description: Successful result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaPage'
        '400':
          description: Invalid input or semantic limit
        '413':
          description: Envelope exceeds 3 MiB
        '422':
          description: Unsupported provider/parser capability
        '429':
          description: Request/concurrency limit
        '502':
          description: Provider transport, denied destination or invalid upstream
            response
  /api/v1/subscriptions/search:
    post:
      summary: Original wd/quick/pg search semantics
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SiteRequest'
      responses:
        '200':
          description: Successful result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaPage'
        '400':
          description: Invalid input or semantic limit
        '413':
          description: Envelope exceeds 3 MiB
        '422':
          description: Unsupported provider/parser capability
        '429':
          description: Request/concurrency limit
        '502':
          description: Provider transport, denied destination or invalid upstream
            response
  /api/v1/subscriptions/detail:
    post:
      summary: Video or cloud directory item details
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SiteRequest'
      responses:
        '200':
          description: Successful result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaDetail'
        '400':
          description: Invalid input or semantic limit
        '413':
          description: Envelope exceeds 3 MiB
        '422':
          description: Unsupported provider/parser capability
        '429':
          description: Request/concurrency limit
        '502':
          description: Provider transport, denied destination or invalid upstream
            response
  /api/v1/subscriptions/play:
    post:
      summary: Resolve opaque type 4 cloud IDs and preserve playback resources
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SiteRequest'
      responses:
        '200':
          description: Successful result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaPlayback'
        '400':
          description: Invalid input or semantic limit
        '413':
          description: Envelope exceeds 3 MiB
        '422':
          description: Unsupported provider/parser capability
        '429':
          description: Request/concurrency limit
        '502':
          description: Provider transport, denied destination or invalid upstream
            response
  /api/v1/subscriptions/action:
    post:
      summary: Fetch a type 4 action result as JSON; no UI script execution
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SiteRequest'
      responses:
        '200':
          description: Successful result
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Invalid input or semantic limit
        '413':
          description: Envelope exceeds 3 MiB
        '422':
          description: Unsupported provider/parser capability
        '429':
          description: Request/concurrency limit
        '502':
          description: Provider transport, denied destination or invalid upstream
            response
  /api/v1/subscriptions/live:
    post:
      summary: Import inline or referenced M3U/TXT/group-JSON live channels
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LiveImportRequest'
      responses:
        '200':
          description: Successful result
          content:
            application/json:
              schema:
                type: object
                properties:
                  channels:
                    type: array
                    items:
                      $ref: '#/components/schemas/Channel'
                  total:
                    type: integer
                  warnings:
                    type: array
                    items:
                      type: string
        '400':
          description: Invalid input or semantic limit
        '413':
          description: Envelope exceeds 3 MiB
        '422':
          description: Unsupported provider/parser capability
        '429':
          description: Request/concurrency limit
        '502':
          description: Provider transport, denied destination or invalid upstream
            response
  /api/v1/cloud/list:
    post:
      summary: AList/OpenList paginated directory listing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CloudRequest'
      responses:
        '200':
          description: Successful result
          content:
            application/json:
              schema:
                type: object
                required:
                - path
                - entries
                - page
                - hasMore
        '400':
          description: Invalid input or semantic limit
        '413':
          description: Envelope exceeds 3 MiB
        '422':
          description: Unsupported provider/parser capability
        '429':
          description: Request/concurrency limit
        '502':
          description: Provider transport, denied destination or invalid upstream
            response
  /api/v1/cloud/play:
    post:
      summary: Get the user-authorized cloud raw or signed media URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CloudRequest'
      responses:
        '200':
          description: Successful result
          content:
            application/json:
              schema:
                type: object
                required:
                - name
                - url
                - headers
        '400':
          description: Invalid input or semantic limit
        '413':
          description: Envelope exceeds 3 MiB
        '422':
          description: Unsupported provider/parser capability
        '429':
          description: Request/concurrency limit
        '502':
          description: Provider transport, denied destination or invalid upstream
            response
  /api/v1/resources/text:
    post:
      summary: Fetch bounded UTF-8 subtitles or danmaku text
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResourceRequest'
      responses:
        '200':
          description: Successful result
          content:
            application/json:
              schema:
                type: object
                required:
                - content
                properties:
                  content:
                    type: string
                    maxLength: 1048576
        '400':
          description: Invalid input or semantic limit
        '413':
          description: Envelope exceeds 3 MiB
        '422':
          description: Unsupported provider/parser capability
        '429':
          description: Request/concurrency limit
        '502':
          description: Provider transport, denied destination or invalid upstream
            response
  /api/v1/home/auth/register:
    post:
      summary: Create an account only while administrator registration is enabled
      security: []
      responses:
        '200':
          description: Successful result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HomeSession'
        '400':
          description: Invalid input
        '401':
          description: Missing, revoked or expired credentials/code
        '403':
          description: Registration disabled
        '404':
          description: Unknown owned resource
        '409':
          description: Revision conflict, device quota or offline target
        '429':
          description: Request/connection limit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Credentials'
  /api/v1/home/auth/login:
    post:
      summary: Authenticate and issue a 90-day device token
      security: []
      responses:
        '200':
          description: Successful result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HomeSession'
        '400':
          description: Invalid input
        '401':
          description: Missing, revoked or expired credentials/code
        '403':
          description: Registration disabled
        '404':
          description: Unknown owned resource
        '409':
          description: Revision conflict, device quota or offline target
        '429':
          description: Request/connection limit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Credentials'
  /api/v1/home/diagnostics:
    get:
      summary: Read aggregate process counters and only this user's device/library totals
      security:
      - deviceBearer: []
      responses:
        '200':
          description: Aggregate diagnostics without tokens, media URLs or other users' data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HomeDiagnostics'
        '401':
          description: Missing, revoked or expired credentials
        '429':
          description: Request or concurrency limit
  /api/v1/home/devices:
    get:
      summary: List this user's active devices
      security:
      - deviceBearer: []
      responses:
        '200':
          description: Successful result
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HomeDevice'
        '400':
          description: Invalid input
        '401':
          description: Missing, revoked or expired credentials/code
        '403':
          description: Registration disabled
        '404':
          description: Unknown owned resource
        '409':
          description: Revision conflict, device quota or offline target
        '429':
          description: Request/connection limit
  /api/v1/home/devices/{id}/revoke:
    post:
      summary: Revoke an owned device and close its remote channel
      security:
      - deviceBearer: []
      responses:
        '200':
          description: Successful result
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Invalid input
        '401':
          description: Missing, revoked or expired credentials/code
        '403':
          description: Registration disabled
        '404':
          description: Unknown owned resource
        '409':
          description: Revision conflict, device quota or offline target
        '429':
          description: Request/connection limit
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          maxLength: 36
  /api/v1/home/pairings:
    post:
      summary: Create a five-minute one-use pairing code
      security:
      - deviceBearer: []
      responses:
        '200':
          description: Successful result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PairingCode'
        '400':
          description: Invalid input
        '401':
          description: Missing, revoked or expired credentials/code
        '403':
          description: Registration disabled
        '404':
          description: Unknown owned resource
        '409':
          description: Revision conflict, device quota or offline target
        '429':
          description: Request/connection limit
  /api/v1/home/pairings/claim:
    post:
      summary: Claim a new device using a one-use pairing code
      security: []
      responses:
        '200':
          description: Successful result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HomeSession'
        '400':
          description: Invalid input
        '401':
          description: Missing, revoked or expired credentials/code
        '403':
          description: Registration disabled
        '404':
          description: Unknown owned resource
        '409':
          description: Revision conflict, device quota or offline target
        '429':
          description: Request/connection limit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PairingRequest'
  /api/v1/home/library:
    get:
      summary: Read the user-scoped library and revision
      security:
      - deviceBearer: []
      responses:
        '200':
          description: Successful result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncedLibrary'
        '400':
          description: Invalid input
        '401':
          description: Missing, revoked or expired credentials/code
        '403':
          description: Registration disabled
        '404':
          description: Unknown owned resource
        '409':
          description: Revision conflict, device quota or offline target
        '429':
          description: Request/connection limit
    post:
      summary: Atomically update only the expected library revision
      security:
      - deviceBearer: []
      responses:
        '200':
          description: Successful result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncedLibrary'
        '400':
          description: Invalid input
        '401':
          description: Missing, revoked or expired credentials/code
        '403':
          description: Registration disabled
        '404':
          description: Unknown owned resource
        '409':
          description: Revision conflict, device quota or offline target
        '429':
          description: Request/connection limit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveLibraryRequest'
  /api/v1/home/remote/ticket:
    post:
      summary: Issue a 30-second one-use WebSocket ticket
      security:
      - deviceBearer: []
      responses:
        '200':
          description: Successful result
          content:
            application/json:
              schema:
                type: object
                required:
                - ticket
                - expiresAt
        '400':
          description: Invalid input
        '401':
          description: Missing, revoked or expired credentials/code
        '403':
          description: Registration disabled
        '404':
          description: Unknown owned resource
        '409':
          description: Revision conflict, device quota or offline target
        '429':
          description: Request/connection limit
  /api/v1/home/remote/devices:
    get:
      summary: List owned devices and remote connection status
      security:
      - deviceBearer: []
      responses:
        '200':
          description: Successful result
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
        '400':
          description: Invalid input
        '401':
          description: Missing, revoked or expired credentials/code
        '403':
          description: Registration disabled
        '404':
          description: Unknown owned resource
        '409':
          description: Revision conflict, device quota or offline target
        '429':
          description: Request/connection limit
  /api/v1/home/remote/commands:
    post:
      summary: Send a bounded command to an online device of this account
      security:
      - deviceBearer: []
      responses:
        '200':
          description: Successful result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RemoteStatus'
        '400':
          description: Invalid input
        '401':
          description: Missing, revoked or expired credentials/code
        '403':
          description: Registration disabled
        '404':
          description: Unknown owned resource
        '409':
          description: Revision conflict, device quota or offline target
        '429':
          description: Request/connection limit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RemoteRequest'
  /api/v1/home/remote/commands/{id}:
    get:
      summary: Read sender-owned command delivery/ACK state for five minutes
      security:
      - deviceBearer: []
      responses:
        '200':
          description: Successful result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RemoteStatus'
        '400':
          description: Invalid input
        '401':
          description: Missing, revoked or expired credentials/code
        '403':
          description: Registration disabled
        '404':
          description: Unknown owned resource
        '409':
          description: Revision conflict, device quota or offline target
        '429':
          description: Request/connection limit
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          maxLength: 36
components:
  schemas:
    TextImportRequest:
      type: object
      required:
      - content
      properties:
        content:
          type: string
          maxLength: 1048576
    Channel:
      type: object
      required:
      - name
      - url
      - group
      properties:
        name:
          type: string
        url:
          type: string
          format: uri
        group:
          type: string
        logo:
          type:
          - string
          - 'null'
        tvgId:
          type:
          - string
          - 'null'
        headers: &id001
          type: object
          maxProperties: 32
          additionalProperties:
            type: string
            maxLength: 8192
    PlaylistResponse:
      type: object
      required:
      - channels
      - total
      properties:
        total:
          type: integer
        channels:
          type: array
          items:
            $ref: '#/components/schemas/Channel'
    SitePreview:
      type: object
      required:
      - key
      - name
      properties:
        key:
          type: string
        name:
          type: string
        type:
          type:
          - integer
          - 'null'
    ConfigPreview:
      type: object
      required:
      - spiderDeclared
      - sites
      - liveGroupCount
      properties:
        spiderDeclared:
          type: boolean
        liveGroupCount:
          type: integer
        sites:
          type: array
          items:
            $ref: '#/components/schemas/SitePreview'
    CatalogPreview:
      type: object
      required:
      - sites
      - liveSources
      - directPlayableChannelCount
      - warnings
      properties:
        sites:
          type: array
          items:
            type: object
            required:
            - key
            - name
            - searchable
            - hidden
            - categories
            - mode
            properties:
              key:
                type: string
              name:
                type: string
              type:
                type:
                - integer
                - 'null'
              searchable:
                type: boolean
              hidden:
                type: boolean
              categories:
                type: array
                items:
                  type: string
              mode:
                type: string
                const: preview-only
        liveSources:
          type: array
          items:
            type: object
            required:
            - name
            - groups
            properties:
              name:
                type: string
              groups:
                type: array
                items:
                  type: object
                  required:
                  - name
                  - channels
                  properties:
                    name:
                      type: string
                    channels:
                      type: array
                      items:
                        type: object
                        required:
                        - name
                        - directUrl
                        - sourceCount
                        properties:
                          name:
                            type: string
                          directUrl:
                            type:
                            - string
                            - 'null'
                          sourceCount:
                            type: integer
        directPlayableChannelCount:
          type: integer
        warnings:
          type: array
          items:
            type: string
    MediaQuery:
      type: object
      required:
      - content
      properties:
        content:
          type: string
          maxLength: 1048576
        categoryId:
          type: string
          maxLength: 100
        query:
          type: string
          maxLength: 120
        vodId:
          type: string
          maxLength: 200
        page:
          type: integer
          minimum: 1
          maximum: 1000
          default: 1
        pageSize:
          type: integer
          minimum: 1
          maximum: 100
          default: 40
        lineIndex:
          type: integer
          minimum: 0
          default: 0
