openapi: 3.1.0
info:
  title: TV-Next API
  version: 0.1.0
  description: |
    Local metadata-only import preview. No remote fetch, Spider execution, media proxy,
    or authenticated personal data in v0.1.0. This contract will evolve.
servers:
  - url: http://localhost:8080
paths:
  /api/v1/health:
    get:
      summary: Health probe
      responses:
        "200":
          description: Service is accepting requests
  /api/v1/playlists/parse:
    post:
      summary: Normalize a user-provided M3U playlist (HTTP/S entries only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TextImportRequest"
      responses:
        "200":
          description: Parsed channels; invalid/non-HTTP entries omitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaylistResponse"
        "400":
          description: Bad input or size limits
  /api/v1/configs/inspect:
    post:
      summary: Inspect FongMi-style JSON without executing configured scripts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TextImportRequest"
      responses:
        "200":
          description: Site and live group descriptors
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigPreview"
        "400":
          description: Invalid JSON or size limits
  /api/v1/catalog/preview:
    post:
      summary: Normalize FongMi sites and live groups without fetching sources or executing Spider
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TextImportRequest"
      responses:
        "200":
          description: Static site descriptors and live channel groups with optional plain HTTP(S) direct URLs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogPreview"
        "400":
          description: Invalid or oversized config
components:
  schemas:
    TextImportRequest:
      type: object
      required: [content]
      properties:
        content:
          type: string
          maxLength: 1048576
    Channel:
      type: object
      required: [name, url, group]
      properties:
        name: { type: string }
        url: { type: string, format: uri }
        group: { type: string }
        logo: { type: [string, "null"] }
        tvgId: { type: [string, "null"] }
    PlaylistResponse:
      type: object
      required: [channels, total]
      properties:
        total: { type: integer }
        channels:
          type: array
          items: { $ref: "#/components/schemas/Channel" }
    SitePreview:
      type: object
      required: [key, name]
      properties:
        key: { type: string }
        name: { type: string }
        type: { type: [integer, "null"] }
    ConfigPreview:
      type: object
      required: [spiderDeclared, sites, liveGroupCount]
      properties:
        spiderDeclared: { type: boolean }
        liveGroupCount: { type: integer }
        sites:
          type: array
          items: { $ref: "#/components/schemas/SitePreview" }

    CatalogPreview:
      type: object
      required: [sites, liveSources, directPlayableChannelCount, warnings]
      properties:
        sites:
          type: array
          items:
            type: object
            required: [key, name, searchable, hidden, categories, mode]
            properties:
              key: { type: string }
              name: { type: string }
              type: { type: [integer, "null"] }
              searchable: { type: boolean }
              hidden: { type: boolean }
              categories:
                type: array
                items: { type: string }
              mode: { type: string, const: preview-only }
        liveSources:
          type: array
          items:
            type: object
            required: [name, groups]
            properties:
              name: { type: string }
              groups:
                type: array
                items:
                  type: object
                  required: [name, channels]
                  properties:
                    name: { type: string }
                    channels:
                      type: array
                      items:
                        type: object
                        required: [name, directUrl, sourceCount]
                        properties:
                          name: { type: string }
                          directUrl: { type: [string, "null"] }
                          sourceCount: { type: integer }
        directPlayableChannelCount: { type: integer }
        warnings:
          type: array
          items: { type: string }
