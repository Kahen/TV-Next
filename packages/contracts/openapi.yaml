openapi: 3.1.0
info:
  title: TV-Next API
  version: 0.1.0
  description: |
    Local metadata-only import preview. No remote fetch, Spider execution, media proxy,
    or authenticated personal data in v0.1.0. This contract will evolve.
servers:
  - url: http://localhost:8080
paths:
  /api/v1/health:
    get:
      summary: Health probe
      responses:
        "200":
          description: Service is accepting requests
  /api/v1/playlists/parse:
    post:
      summary: Normalize a user-provided M3U playlist (HTTP/S entries only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TextImportRequest"
      responses:
        "200":
          description: Parsed channels; invalid/non-HTTP entries omitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaylistResponse"
        "400":
          description: Bad input or size limits
  /api/v1/configs/inspect:
    post:
      summary: Inspect FongMi-style JSON without executing configured scripts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TextImportRequest"
      responses:
        "200":
          description: Site and live group descriptors
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigPreview"
        "400":
          description: Invalid JSON or size limits
  /api/v1/catalog/preview:
    post:
      summary: Normalize FongMi sites and live groups without fetching sources or executing Spider
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TextImportRequest"
      responses:
        "200":
          description: Static site descriptors and live channel groups with optional plain HTTP(S) direct URLs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogPreview"
        "400":
          description: Invalid or oversized config
  /api/v1/media/home:
    post:
      summary: Browse user-pasted FongMi Result (static only; no network calls)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MediaQuery" }
      responses:
        "200":
          description: Categories and paginated items
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MediaPage" }
        "400": { description: Invalid media JSON or pagination }
  /api/v1/media/category:
    post:
      summary: Filter imported items by categoryId
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MediaQuery" }
      responses:
        "200":
          description: Filtered page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MediaPage" }
        "400": { description: Invalid category }
  /api/v1/media/search:
    post:
      summary: Local title search within imported Result JSON
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MediaQuery" }
      responses:
        "200":
          description: Matching items
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MediaPage" }
        "400": { description: Invalid search query }
  /api/v1/media/detail:
    post:
      summary: Read imported video metadata, lines and episodes
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MediaQuery" }
      responses:
        "200":
          description: Static video details
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MediaDetail" }
        "400": { description: Invalid request }
        "404": { description: Video not present in JSON }
  /api/v1/media/play:
    post:
      summary: Return plain imported HTTP(S) episode URL (no proxying)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MediaQuery" }
      responses:
        "200":
          description: Direct playback URL
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MediaPlayback" }
        "400": { description: Invalid episode selection }
        "404": { description: Video not present }
        "422": { description: Unsupported parser required }
  /api/v1/epg/guide:
    post:
      summary: Match uploaded XMLTV to imported M3U channels (offline, no URL fetching)
      description: |
        Parses an explicitly provided XMLTV document with external XML entities and DTDs
        disabled. Matches tvg-id first, then unique XMLTV display-name. No remote feed
        fetching, persistence, EPG subscription or streaming is performed.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EpgGuideRequest" }
      responses:
        "200":
          description: Current and upcoming programmes for requested channels
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EpgGuideResponse" }
        "400":
          description: Invalid XML, forbidden DOCTYPE, timestamps or request limits
        "503":
          description: Secure XML parser unavailable
components:
  schemas:
    TextImportRequest:
      type: object
      required: [content]
      properties:
        content:
          type: string
          maxLength: 1048576
    Channel:
      type: object
      required: [name, url, group]
      properties:
        name: { type: string }
        url: { type: string, format: uri }
        group: { type: string }
        logo: { type: [string, "null"] }
        tvgId: { type: [string, "null"] }
    PlaylistResponse:
      type: object
      required: [channels, total]
      properties:
        total: { type: integer }
        channels:
          type: array
          items: { $ref: "#/components/schemas/Channel" }
    SitePreview:
      type: object
      required: [key, name]
      properties:
        key: { type: string }
        name: { type: string }
        type: { type: [integer, "null"] }
    ConfigPreview:
      type: object
      required: [spiderDeclared, sites, liveGroupCount]
      properties:
        spiderDeclared: { type: boolean }
        liveGroupCount: { type: integer }
        sites:
          type: array
          items: { $ref: "#/components/schemas/SitePreview" }

    CatalogPreview:
      type: object
      required: [sites, liveSources, directPlayableChannelCount, warnings]
      properties:
        sites:
          type: array
          items:
            type: object
            required: [key, name, searchable, hidden, categories, mode]
            properties:
              key: { type: string }
              name: { type: string }
              type: { type: [integer, "null"] }
              searchable: { type: boolean }
              hidden: { type: boolean }
              categories:
                type: array
                items: { type: string }
              mode: { type: string, const: preview-only }
        liveSources:
          type: array
          items:
            type: object
            required: [name, groups]
            properties:
              name: { type: string }
              groups:
                type: array
                items:
                  type: object
                  required: [name, channels]
                  properties:
                    name: { type: string }
                    channels:
                      type: array
                      items:
                        type: object
                        required: [name, directUrl, sourceCount]
                        properties:
                          name: { type: string }
                          directUrl: { type: [string, "null"] }
                          sourceCount: { type: integer }
        directPlayableChannelCount: { type: integer }
        warnings:
          type: array
          items: { type: string }

    MediaQuery:
      type: object
      required: [content]
      properties:
        content: { type: string, maxLength: 1048576 }
        categoryId: { type: string, maxLength: 100 }
        query: { type: string, maxLength: 120 }
        vodId: { type: string, maxLength: 200 }
        page: { type: integer, minimum: 1, maximum: 1000, default: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100, default: 40 }
        lineIndex: { type: integer, minimum: 0, default: 0 }
        episodeIndex: { type: integer, minimum: 0, default: 0 }
    MediaItem:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
        categoryId: { type: [string, "null"] }
        categoryName: { type: [string, "null"] }
        poster: { type: [string, "null"] }
        remarks: { type: [string, "null"] }
        year: { type: [string, "null"] }
    MediaPage:
      type: object
      required: [categories, items, total, page, pageSize, hasMore, provider]
      properties:
        categories:
          type: array
          items:
            type: object
            required: [id, name]
            properties:
              id: { type: string }
              name: { type: string }
        items:
          type: array
          items: { $ref: "#/components/schemas/MediaItem" }
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }
        hasMore: { type: boolean }
        provider: { type: string }
    MediaDetail:
      type: object
      required: [item, lines, provider]
      properties:
        item: { $ref: "#/components/schemas/MediaItem" }
        description: { type: [string, "null"] }
        director: { type: [string, "null"] }
        actors: { type: [string, "null"] }
        provider: { type: string }
        lines:
          type: array
          items:
            type: object
            required: [name, episodes]
            properties:
              name: { type: string }
              episodes:
                type: array
                items:
                  type: object
                  required: [name, playable]
                  properties:
                    name: { type: string }
                    playable: { type: boolean }
    MediaPlayback:
      type: object
      required: [url, name, lineName, provider]
      properties:
        url: { type: string, format: uri }
        name: { type: string }
        lineName: { type: string }
        provider: { type: string }

    EpgGuideRequest:
      type: object
      required: [xml, channels]
      properties:
        xml: { type: string, maxLength: 2097152 }
        channels:
          type: array
          minItems: 1
          maxItems: 300
          items:
            type: object
            required: [name]
            properties:
              id: { type: [string, "null"] }
              name: { type: string }
        at: { type: [string, "null"], format: date-time }
        hours: { type: integer, minimum: 1, maximum: 72, default: 12 }
    EpgProgram:
      type: object
      required: [start, stop, title]
      properties:
        start: { type: string, format: date-time }
        stop: { type: string, format: date-time }
        title: { type: string }
        description: { type: [string, "null"] }
    EpgChannelGuide:
      type: object
      required: [name, matchType, upcoming]
      properties:
        id: { type: [string, "null"] }
        name: { type: string }
        matchedChannelId: { type: [string, "null"] }
        matchType: { type: string, enum: [id, name, none] }
        current:
          anyOf:
            - { $ref: "#/components/schemas/EpgProgram" }
            - { type: "null" }
        upcoming:
          type: array
          items: { $ref: "#/components/schemas/EpgProgram" }
    EpgGuideResponse:
      type: object
      required: [generatedAt, until, totalChannels, matchedChannels, channels, warnings]
      properties:
        generatedAt: { type: string, format: date-time }
        until: { type: string, format: date-time }
        totalChannels: { type: integer }
        matchedChannels: { type: integer }
        channels:
          type: array
          items: { $ref: "#/components/schemas/EpgChannelGuide" }
        warnings:
          type: array
          items: { type: string }
