services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tvnext
      POSTGRES_USER: tvnext
      POSTGRES_PASSWORD: ${TV_NEXT_DB_PASSWORD:?Set TV_NEXT_DB_PASSWORD}
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tvnext -d tvnext"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  api:
    build:
      context: ./services/api
    depends_on:
      db:
        condition: service_healthy
    environment:
      TV_NEXT_DB_URL: jdbc:postgresql://db:5432/tvnext
      TV_NEXT_DB_USER: tvnext
      TV_NEXT_DB_PASSWORD: ${TV_NEXT_DB_PASSWORD:?Set TV_NEXT_DB_PASSWORD}
      TV_NEXT_REGISTRATION_OPEN: ${TV_NEXT_REGISTRATION_OPEN:-false}
      TV_NEXT_CORS_ALLOWED_ORIGINS: ${TV_NEXT_CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      TV_NEXT_LAN_ORIGINS: ${TV_NEXT_LAN_ORIGINS:-}
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,size=128m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 768m
    restart: unless-stopped
  web:
    build:
      context: ./apps/web
    depends_on: [api]
    ports:
      - "${TV_NEXT_BIND_ADDR:-127.0.0.1}:3000:80"
    restart: unless-stopped
volumes:
  pg-data:
