services:
  api:
    build:
      context: ./services/api
    environment:
      TV_NEXT_CORS_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped
  web:
    build:
      context: ./apps/web
    depends_on:
      - api
    ports:
      - "127.0.0.1:3000:80"
    restart: unless-stopped
