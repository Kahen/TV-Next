services:
  api:
    build:
      context: ./services/api
    environment:
      TV_NEXT_DB_URL: jdbc:h2:file:/data/tvnext;DB_CLOSE_ON_EXIT=FALSE
      TV_NEXT_REGISTRATION_OPEN: ${TV_NEXT_REGISTRATION_OPEN:-false}
      TV_NEXT_CORS_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      TV_NEXT_LAN_ORIGINS: ${TV_NEXT_LAN_ORIGINS:-}
      TV_NEXT_SPIDER_ANDROID_URL: ${TV_NEXT_SPIDER_ANDROID_URL:-}
      TV_NEXT_SPIDER_BINDINGS: ${TV_NEXT_SPIDER_BINDINGS:-}
    volumes:
      - api-data:/data
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped
  web:
    build:
      context: ./apps/web
    depends_on:
      - api
    ports:
      - "127.0.0.1:3000:80"
    restart: unless-stopped

volumes:
  api-data:
